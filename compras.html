<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>once · compras y mermas</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <a href="admin.html" class="btn-volver">‹</a>
  <span class="brand-sub">compras y mermas</span>
</header>

<main id="vista-compras" class="admin-contenido oculto">

  <div class="tabs">
    <button class="tab activa" data-tab="compra">Compra</button>
    <button class="tab" data-tab="merma">Merma</button>
    <button class="tab" data-tab="deposito">Depósito</button>
    <button class="tab" data-tab="maduracion">Maduración</button>
    <button class="tab" data-tab="precio">Precio</button>
  </div>

  <div id="panel-compra" class="tab-panel">
    <form id="form-compra" class="form-carga">
      <label>Producto
        <select id="compra-producto" required></select>
      </label>
      <button type="button" id="btn-mostrar-nuevo-producto" class="btn-texto btn-enlace-chico">+ Nuevo producto</button>

      <div id="form-nuevo-producto" class="form-carga oculto">
        <label>Nombre
          <input type="text" id="nuevo-producto-nombre" placeholder="ej: Naranja de ombligo">
        </label>
        <div class="switch-fila">
          <span class="switch-etiqueta">Por peso (kg)</span>
          <label class="switch">
            <input type="checkbox" id="nuevo-producto-tipo">
          </label>
          <span class="switch-etiqueta">Por unidad</span>
        </div>
        <label>Precio inicial <span class="muted">(lo vas a poder ajustar en la compra)</span>
          <input type="number" id="nuevo-producto-precio" min="0" step="1">
        </label>
        <div class="acciones-pedido">
          <button type="button" id="btn-crear-producto" class="btn-confirmar">Crear producto</button>
          <button type="button" id="btn-cancelar-nuevo-producto" class="btn-cancelar">Cancelar</button>
        </div>
        <p id="nuevo-producto-error" class="error oculto"></p>
      </div>

      <p id="compra-stock-actual" class="muted oculto"></p>

      <div class="fila-2">
        <label>Cantidad
          <input type="number" id="compra-cantidad" min="0.01" step="0.01" inputmode="decimal" required>
        </label>
        <label>Costo total
          <input type="number" id="compra-costo" min="0" step="1" inputmode="decimal" required>
        </label>
      </div>

      <label>Proveedor <span class="muted">(opcional)</span>
        <input type="text" id="compra-proveedor">
      </label>

      <label>Margen objetivo %
        <input type="number" id="compra-margen" min="0" step="1" placeholder="ej: 30">
      </label>

      <label>Estado del producto al llegar
        <div class="grupo-opciones" id="grupo-madurez">
          <button type="button" class="opcion-btn activa" data-valor="0">Recién llega</button>
          <button type="button" class="opcion-btn" data-valor="50">A mitad</button>
          <button type="button" class="opcion-btn" data-valor="90">Para vender ya</button>
        </div>
      </label>

      <div class="switch-fila">
        <span class="switch-etiqueta">Depósito</span>
        <label class="switch">
          <input type="checkbox" id="compra-ubicacion" checked>
          <span class="switch-slider"></span>
        </label>
        <span class="switch-etiqueta">Salón</span>
      </div>

      <button type="submit" class="btn-primario">Registrar compra</button>
      <p id="compra-error" class="error oculto"></p>
    </form>

    <div id="compra-sugerencia" class="sugerencia-precio oculto">
      <p class="sugerencia-linea">Costo unitario: <strong id="sug-costo"></strong></p>
      <p class="sugerencia-linea">Precio sugerido para este lote: <strong id="sug-precio"></strong></p>
      <p class="muted sugerencia-linea">Precio con el que quedó cargado: <span id="sug-precio-actual"></span></p>
      <label>O poné el precio que quieras para este lote
        <input type="number" id="sug-precio-manual" min="0" step="1">
      </label>
      <div class="acciones-pedido">
        <button id="btn-usar-sugerido" class="btn-confirmar">Guardar este precio</button>
        <button id="btn-mantener-precio" class="btn-cancelar">Cerrar</button>
      </div>
    </div>
  </div>

  <div id="panel-merma" class="tab-panel oculto">
    <form id="form-merma" class="form-carga">
      <label>Producto
        <select id="merma-producto" required></select>
      </label>
      <label>Cantidad
        <input type="number" id="merma-cantidad" min="0.01" step="0.01" inputmode="decimal" required>
      </label>
      <label>Motivo
        <select id="merma-motivo">
          <option value="perecido">Perecido</option>
          <option value="vencido">Vencido</option>
          <option value="roto">Roto / dañado</option>
          <option value="otro">Otro</option>
        </select>
      </label>
      <button type="submit" class="btn-primario">Registrar merma</button>
      <p id="merma-error" class="error oculto"></p>
    </form>
  </div>

  <div id="panel-deposito" class="tab-panel oculto">
    <div id="lista-deposito"><p class="muted">Cargando…</p></div>
  </div>

  <div id="panel-maduracion" class="tab-panel oculto">
    <div id="lista-maduracion"><p class="muted">Cargando…</p></div>
  </div>

  <div id="panel-precio" class="tab-panel oculto">
    <label>Producto
      <select id="precio-producto"></select>
    </label>
    <div id="lista-precio-lotes"><p class="muted">Cargando…</p></div>
  </div>

</main>

<script type="module" src="compras.js"></script>
</body>
</html>
